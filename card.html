<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heather Tully | Detail Oriented Digital Card</title>
  <style>
    :root {
      --bg: #1f1f1f;
      --card-bg: #2a2a2a;
      --text: #F5F5F5;
      --text-muted: #A0A0A0;
      --purple: #B794C6;
      --teal: #00D9C0;
      --pink: #F4A261;
      --border: #383838;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo-mark {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      object-fit: contain;
    }
    .name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }
    .company {
      font-size: 15px;
      font-weight: 500;
      color: var(--purple);
      text-transform: lowercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .bio {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 28px;
      max-width: 360px;
    }
    .links-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 100px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-link:hover, .btn-link:active {
      background: rgba(255,255,255,0.12);
      border-color: var(--purple);
      transform: translateY(-1px);
    }
    .btn-link.primary {
      background: var(--purple);
      color: #1f1f1f;
      border: none;
    }
    .btn-link.primary:hover, .btn-link.primary:active {
      background: #c7a7d6;
    }
    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <img src="https://detailoriented.me/f3a7fcc7-30e6-4785-a4bd-fc4a2bd1b7bb" alt="Detail Oriented" class="logo-mark" onerror="this.style.display='none'">
    <h1 class="name">Heather Tully</h1>
    <div class="company">detail oriented</div>
    <p class="bio">Building high-performance small business systems, operational automation, and bespoke digital infrastructure.</p>
    
    <div class="links-grid">
      <a href="https://detailoriented.me" class="btn-link primary">
        <span>Visit Main Website</span>
      </a>
      <a href="mailto:heather@detailoriented.me" class="btn-link">
        <span>Email Heather</span>
      </a>
      <a href="https://detailoriented.me#contact" class="btn-link">
        <span>Get in Touch</span>
      </a>
    </div>

    <div class="footer-note">detailoriented.me</div>
  </div>
</body>
</html>
